<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lissafi · La caisse enregistreuse mobile qui remplace le cahier | Android</title>
    <meta
      name="description"
      content="Lissafi est une caisse enregistreuse mobile Android pour les petits commerces africains : gestion de crédits clients, stock, ticket WhatsApp, calcul de la monnaie, le tout sans réseau. 14 jours d'essai gratuit, puis à partir de 3 000 F/mois (24 000 F/an)."
    />
    <meta name="theme-color" content="#05100B" />
    <meta name="author" content="Lissafi" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/logo-master.png" />
    <link rel="canonical" href="{SITE_URL}/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Lissafi" />
    <meta property="og:title" content="Lissafi · Ton commerce, maîtrisé." />
    <meta
      property="og:description"
      content="La caisse enregistreuse mobile qui remplace le cahier : caisse, crédits clients, stock et ticket WhatsApp, même sans réseau. 14 jours d'essai gratuit."
    />
    <meta property="og:image" content="{SITE_URL}/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="{SITE_URL}/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lissafi · Ton commerce, maîtrisé." />
    <meta
      name="twitter:description"
      content="La caisse enregistreuse mobile qui remplace le cahier. 14 jours d'essai gratuit, puis à partir de 3 000 F/mois."
    />
    <meta name="twitter:image" content="{SITE_URL}/assets/og-image.png" />

    <!-- Police : Inter (identique à l'app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Données structurées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Lissafi",
            "slogan": "Ton commerce, maîtrisé.",
            "logo": "/assets/logo-master.png",
            "description": "Caisse enregistreuse mobile Android pour petits commerces informels en Afrique : caisse, crédits clients, stock, ticket WhatsApp, sans réseau."
          },
          {
            "@type": "Product",
            "name": "Lissafi",
            "description": "Application Android de caisse enregistreuse mobile pour petit commerce : gestion de crédits clients, stock, ticket WhatsApp, calcul de la monnaie, mode hors-ligne.",
            "brand": { "@type": "Brand", "name": "Lissafi" },
            "offers": {
              "@type": "Offer",
              "price": "24000",
              "priceCurrency": "XOF",
              "description": "Petite boutique : jusqu'à 200 produits, clients illimités et ventes illimitées (66 FCFA par jour). 14 jours d'essai gratuit."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
