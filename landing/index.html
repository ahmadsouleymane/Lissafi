<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lissafi — La caisse enregistreuse mobile qui remplace le cahier | Android</title>
    <meta
      name="description"
      content="Lissafi est une caisse enregistreuse mobile Android pour les petits commerces du Niger et d'Afrique de l'Ouest : gestion de crédits clients, stock, ticket WhatsApp, calcul de la monnaie — et ça marche sans réseau. Gratuit pour tester, Premium 15 000 F/an."
    />
    <meta name="theme-color" content="#2E8B57" />
    <meta name="author" content="Lissafi" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/logo-master.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Lissafi" />
    <meta property="og:title" content="Lissafi — Ton commerce, maîtrisé." />
    <meta
      property="og:description"
      content="La caisse enregistreuse mobile qui remplace le cahier : caisse, crédits clients, stock et ticket WhatsApp, même sans réseau. Gratuit pour tester."
    />
    <meta property="og:image" content="/assets/logo-master.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lissafi — Ton commerce, maîtrisé." />
    <meta
      name="twitter:description"
      content="La caisse enregistreuse mobile qui remplace le cahier. Gratuit pour tester, Premium 15 000 F/an."
    />
    <meta name="twitter:image" content="/assets/logo-master.png" />

    <!-- Polices : Fraunces (display), Instrument Sans (texte), Space Mono (reçus) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Données structurées -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Lissafi",
            "slogan": "Ton commerce, maîtrisé.",
            "logo": "/assets/logo-master.png",
            "description": "Caisse enregistreuse mobile Android pour petits commerces informels au Niger et en Afrique de l'Ouest : caisse, crédits clients, stock, ticket WhatsApp, sans réseau."
          },
          {
            "@type": "Product",
            "name": "Lissafi",
            "description": "Application Android de caisse enregistreuse mobile pour petit commerce : gestion de crédits clients, stock, ticket WhatsApp, calcul de la monnaie, mode hors-ligne.",
            "brand": { "@type": "Brand", "name": "Lissafi" },
            "offers": {
              "@type": "Offer",
              "price": "15000",
              "priceCurrency": "XOF",
              "description": "Lissafi Premium — tout illimité pendant 1 an (41 FCFA par jour)"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
