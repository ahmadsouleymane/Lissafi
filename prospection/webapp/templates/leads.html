{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Prospects ({{ rows|length }})</h1>
  <form class="row" method="get" action="/leads">
    <input name="q" value="{{ cur_q }}" placeholder="Rechercher nom / adresse…">
    <select name="type">
      <option value="">Tous types</option>
      {% for t in types %}
      <option value="{{ t }}" {% if t == cur_type %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
    <select name="statut">
      <option value="">Tous statuts</option>
      {% for s in statuts %}
        {% if s %}
        <option value="{{ s }}" {% if s == cur_statut %}selected{% endif %}>{{ s }}</option>
        {% endif %}
      {% endfor %}
    </select>
    <label><input type="checkbox" name="phone" value="1" {% if only_phone %}checked{% endif %}> avec téléphone</label>
    <button type="submit">Filtrer</button>
  </form>
</div>

<div class="card">
  <table>
    <tr><th>Nom</th><th>Type</th><th>Téléphone</th><th>Score</th><th>Statut</th><th></th></tr>
    {% for p in rows %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.target_type or '' }}</td>
      <td>{{ p.phone or '' }}</td>
      <td>{{ p.score }}</td>
      <td><span class="badge {{ p.statut or 'vide' }}">{{ p.statut or '—' }}</span></td>
      <td><a class="btn" href="/leads/{{ p.id }}">Ouvrir</a></td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="muted">Aucun prospect.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
