# Mémoire JVM pour Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (AGP 9 : activé par défaut, on le déclare explicitement)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Style officiel Kotlin
kotlin.code.style=official

# Réseau lent : timeouts HTTP longs (Niamey → Google Maven/Maven Central)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=5000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
